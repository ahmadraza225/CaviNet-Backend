name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cavinet
          POSTGRES_PASSWORD: cavinet
          POSTGRES_DB: cavinet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cavinet -d cavinet_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cavinet:cavinet@localhost:5432/cavinet_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ahmadraza225/CaviNet-ML
          path: .cavinet-ml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .cavinet-ml/pyproject.toml
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.8,<3"
          pip install ./.cavinet-ml -e ".[dev]"
      - name: Lint
        run: |
          ruff check . --extend-exclude .cavinet-ml
          ruff format --check . --extend-exclude .cavinet-ml
      - name: Test (unit + integration)
        run: pytest --cov --cov-report=term-missing
