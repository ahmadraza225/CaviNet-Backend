line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[lint.isort]
known-first-party = ["app", "cavinet_ml"]
# The alembic/ folder holds migrations; the import is the third-party package.
known-third-party = ["alembic"]

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
